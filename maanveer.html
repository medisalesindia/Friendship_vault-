
<!DOCTYPE html>

<head>

<body>

<div class="background"></div>

<section class="hero">

<h1>❤️ Happy Friendship Day ❤️</h1>

<h2>Maanveer</h2>

<p id="typing"></p>

<a class="music-btn"
href="https://www.youtube.com/results?search_query=Stand+By+Me+Ben+E+King"
target="_blank">

▶ Play Stand By Me

</a>

<a class="back-btn"

href="choose.html">

⬅ Back

</a>

</section>

<script>

const message=`Hey Maanveer,

Some people become friends...
but a few become family.

Thank you for every laugh,
every joke,
every crazy moment
and every memory.

No matter where life takes us,
I'll always be grateful
to have a friend like you.

Happy Friendship Day ❤️

— Rajveer`;

let i=0;

function type(){

if(i<message.length){

document.getElementById("typing").innerHTML+=message.charAt(i);

i++;

setTimeout(type,35);

}

}

type();

</script>

</body>
